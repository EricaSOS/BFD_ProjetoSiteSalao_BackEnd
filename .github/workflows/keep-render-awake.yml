name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend..."
          curl -L --max-time 90 --retry 2 --retry-delay 10 \
            https://bfd-projeto-salao-backend.onrender.com/healthz
            