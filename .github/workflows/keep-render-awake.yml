name: Keep Render Awake

on:
  schedule:
    # Segunda a sábado, 06:00 às 20:59 em Belém
    # UTC: 09:00 às 23:59
    - cron: "2-59/5 9-23 * * 1-6"
    # Segunda a sábado, 21:00 às 22:59 em Belém
    # UTC: 00:00 às 01:59 do dia seguinte
    - cron: "2-59/5 0-1 * * 2-7"


  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend..."
          curl -L --max-time 90 --retry 2 --retry-delay 10 \
            https://bfd-projeto-salao-backend.onrender.com/healthz
